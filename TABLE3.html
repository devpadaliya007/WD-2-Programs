<html>
<head>
  <title>TABLE 3</title>
</head>
<body>
     <form>
        <label for="full-name">Full Name:</label>
        <input type="text" id="full-name" name="full-name" required><br><br>

         <label for="email">Email:</label>
         <input type="email" id="email" name="email" required><br><br>

         <label for="mobile-no">Mobile Number:</label>
         <input type="tel" id="mobile-no" name="mobile-no" required><br><br>

        <label for="address">Address:</label>
        <textarea id="address" name="address" required></textarea><br><br>

        <label for="nationality">Nationality:</label>
        <input type="text" id="nationality" name="nationality" required><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required><br><br>

        <label for="gender">Gender:</label>
          <select id="gender" name="gender" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select><br><br>

        <label for="degree">Highest Degree:</label>
        <input type="text" id="degree" name="degree" required><br><br>

        <label for="cpi">CPI:</label>
        <input type="number" id="cpi" name="cpi" step="0.01" required><br><br>

        <label for="university">University:</label>
        <input type="text" id="university" name="university" required><br><br>

        <label for="passing-year">Passing Year:</label>
        <input type="number" id="passing-year" name="passing-year" required><br><br>

        <input type="submit" value="Submit">
        <input type="submit" value="Cancel">
      </form>
  </body>
  </html>
