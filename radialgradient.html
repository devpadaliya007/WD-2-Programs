<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 150px;
            width: 200px;
            background-color: red;
        }
        #grad1{
            background-image: radial-gradient(red 5%,yellow 15%,green 60%);
        }
        #grad2{
            background-image: radial-gradient(closest side at 60% 55%,red,yellow,green);
        }
        #grad3{
            background-image: radial-gradient(farest side at 60% 55%,red,yellow,green);
        }
        #grad4{
            background-image: radial-gradient(closest corner at 60% 55%,red,yellow,green);
        }
        #grad5{
            background-image: radial-gradient(farest corner at 60% 55%,red,yellow,green);
        }
        #grad6{
            background-image: repeating-radial-gradient(red,yellow 10%,green 15%);
        }
    </style>
</head>
<body>
    <div id="grad1"></div>
    <div id="grad2"></div>
    <div id="grad3"></div>
    <div id="grad4"></div>
    <div id="grad5"></div>
    <div id="grad6"></div>
</body>
</html>
