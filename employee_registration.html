<!DOCTYPE html>
<html>
<head>
	<title>Employee Registration</title>
</head>
<body>
	<fieldset>
			<h1 align="center">Employee Registration</h1>
			<table cellpadding="8" align="center">
				<form>
				<tr>
					<th>Personal Information</th>
				</tr>
				<tr>
					<td>Employee ID<input type="text" placeholder="Enter Employee ID"></td>				
					<td>Employee Name<input type="text" placeholder="Enter Employee Name"></td>
				</tr>
				<tr>
					<td>Email<input type="text" placeholder="Email"></td>
					<td>Contact No<input type="text" placeholder="Contact No"></td>
				</tr>
				<tr>
					<td>Martial Status Single<input type="radio" name="Single">
						Married<input type="radio" name="Single">
					</td>		
				</tr>
				<tr>
					<th>Education Qualification</th>
				</tr>
				<tr>
					<td>Education<input type="text" placeholder="Enter Education Detail"></td>
					<td>Experience<input type="text" placeholder="Enter Experience Detail"></td>
				</tr>
				<tr>
					<th>Job Details</th>
				</tr>
				<tr>
					<td>Designation<input type="text" placeholder="Enter Designation Details"></td>
					<td>Job<input type="text" placeholder="Enter Job Location"></td>
				<tr>
					<td>Salary<input type="text" placeholder="Enter Salary Details"></td>
				</tr>
				<tr>
					<td align="center" colspan="6"><input type="button" value="Register">
					</td>
				</tr>
				</table>
			</form>
			</fieldset>
	</body>
</html>
