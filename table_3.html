<html>
	<head>
		
	</head>
	<body>
		<form>
			<table align="center">
				<tr>
					<th>Student Registration</th>
				</tr>
				<tr>
					<td>Full Name:<input type="text" name="Name"><br></td>
				</tr>
				<tr>
					<td>Email:<input type="email" name="email"><br></td>
				</tr>
				<tr>
					<td>mobile:
					<input type="tel" name="Mobile No"><br></td>
				</tr>
				<tr>
					<td>Address:<textarea name="Name"></textarea><br></td>
				</tr>
				<tr>
					<td>Nationality:
					<select>
						<option>Indain</option>
						<option>Canada</option>
						<option>Honkong</option>
					</select><br></td>
				</tr>
				<tr>
					<td>Date Of Birth:<input type="date" name="Name"><br></td>
				</tr>
				<tr>
					<td>Gender:
					male<input type="radio" name="A">
					female<input type="radio" name="A"><br></td>
				</tr>
				<tr>
					<td>Highest Degree:
						<select>
						<option>12th Pass</option>
						<option>Graduation</option>
						<option>Bachelor</option>
						<option>Master</option>
						<option>Others</option>
					</select><br></td>
				</tr>
				<tr>
				<tr>
					<td>C.P.I.:<input type="number" id="cpi" name="cpi" step="0.01" required><br><br>

				</tr>
				<tr>
					<td>University:<input type="text" name="University"><br></td>
				</tr>
				<tr>
					<td>Passing Year:
					<select>
						<option>2023</option>
						<option>2022</option>
						<option>2021</option>
						<option>Others</option>
					</select>
					</td>
				</tr>
				<tr>
					<td><input type="button" value="Submit">
 						<input type="button" value="Cancel">
 					</td>
				</tr>
			</table>
		</form>
	</body>
</html>
