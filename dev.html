<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <form onsubmit="return validateForm()">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card text-center">
                        <div class="card-header">
                            <h2>Registration Form</h2>
                        </div>
                        <div class="card-body">

                            <div class="mb-3">
                                <input type="text" id="fname" class="form-control" placeholder="First Name">
                            </div>

                            <div class="mb-3">
                                <input type="text" id="lname" class="form-control" placeholder="Last Name">
                            </div>

                            <div class="mb-3">
                                <select class="form-select" id="dept">
                                    <option value="">Department/Office</option>
                                    <option>IT</option>
                                    <option>HR</option>
                                    <option>Finance</option>
                                    <option>Sales</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <input type="text" id="user" class="form-control" placeholder="Username">
                            </div>

                            <div class="mb-3">
                                <input type="password" id="pass" class="form-control" placeholder="Password">
                            </div>

                            <div class="mb-3">
                                <input type="password" id="cpass" class="form-control" placeholder="Confirm Password">
                            </div>

                            <div class="mb-3">
                                <input type="email" id="email" class="form-control" placeholder="E-Mail Address">
                            </div>

                            <div class="mb-3">
                                <input type="tel" id="phone" class="form-control" placeholder="Contact No.">
                            </div>

                            <button type="submit" class="btn btn-warning">SUBMIT</button>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script>
        function validateForm() {
            let f = document.getElementById("fname").value;
            let u = document.getElementById("user").value;
            let p = document.getElementById("pass").value;
            let c = document.getElementById("cpass").value;
            let e = document.getElementById("email").value;
            let d = document.getElementById("dept").value;

            if (!f || !u || !p || !c || !e || !d) {
                alert("Please fill all required fields");
                return false;
            }
            if (p !== c) {
                alert("Passwords do not match");
                return false;
            }
            alert("Registration Successful!");
            return false;
        }
    </script>

</body>

</html>
