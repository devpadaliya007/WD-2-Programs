<!DOCTYPE html>
<html>
<head>
	<title>Image Property</title>
<style>
	img{
		border-radius:30px;
		}
	img{
		border:1px solid #ddd;
		border-radius:20px;
		padding:10px;
		width:1000px;
		height:1000px;
	}
	img: hover{
				box-shadow:0 0 2px 1px rgba(0, 140, 186, 0.5);
	}
	img{
		max-width:100%;
		height:auto;
	}
	</style>
	</head>
<body>
	<h2>Ronded Image</h2>
	<p>Use Border Radius Property to Create Rounded Images:</p>
	<a target="_blank" href="image.png">
	<img src="image.png" alt="paris" width="300" height="300">
</body>
</html>
