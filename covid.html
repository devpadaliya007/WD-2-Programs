<html>
 	<head>
 		 <title>Covid Form</title>
         <link rel="stylesheet" type="text/css" href="form.css">
 	</head>
 	<body>
 		<fieldset>
 			<form id="para1">
 				<table cellpadding="20">
 					<tr>
 						<td>First Name<input id="para2" type="text" placeholder="FName"></td>
 					</tr>
 					<tr>
 						<td>Last Name<input id="para2" type="text" placeholder="LName"></td>
 					</tr>
 					<tr>
 						<td>Aadhar No<input id="para2" type="text" placeholder="aadhar no"></td>
 					</tr>
 					<tr>
 						<td>Vaccine Name
 							<select id="para2">
 								<option>CPM</option>
 								<option>PCM</option>
 								<option>Azithro</option>
 							</select>
 						</td>
 					</tr>
 					<tr>
 						<td>Vaccine Center Name
 							<select id="para2">
 								<option>Civil Hospital</option>
 								<option>Sahyog Hospial</option>
 								<option>Private Hospital</option>
 							</select>
 						</td>
 					<tr>
 						<td>Date Of Dose<input id="para2" type="date"></td>
 					</tr>
 					<tr>
 						<td>Dose No<input id="para2" type="text" placeholder="Enter No."></td>
 					</tr>
 					<tr>
 						<td><input type="button" value="Click Here">
 							<input type="button" value="Cancel"></td>
 					</tr>
 				</form>
 			</fieldset>
 		</table>
 	</body>
 </html>
